<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #000; }
      .w  { fill: #ffffff; }
      .g1 { fill: #e5e5e5; }
      .g2 { fill: #a3a3a3; }
      .g3 { fill: #737373; }
      .g4 { fill: #404040; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #000; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="32" height="32" rx="2"/>

  <!-- Seismic wave - flat left baseline -->
  <rect class="g3" x="2"  y="15" width="2" height="2"/>
  <rect class="g2" x="4"  y="15" width="2" height="2"/>
  <rect class="w"  x="6"  y="15" width="2" height="2"/>

  <!-- Wave spike up-left -->
  <rect class="w" x="8"  y="13" width="2" height="2"/>
  <rect class="w" x="10" y="9"  width="2" height="2"/>
  <rect class="w" x="10" y="11" width="2" height="2"/>
  <rect class="w" x="12" y="5"  width="2" height="2"/>
  <rect class="w" x="12" y="7"  width="2" height="2"/>

  <!-- Peak -->
  <rect class="w" x="14" y="3"  width="2" height="2"/>

  <!-- Wave spike down-right -->
  <rect class="w" x="16" y="5"  width="2" height="2"/>
  <rect class="w" x="16" y="7"  width="2" height="2"/>
  <rect class="w" x="18" y="9"  width="2" height="2"/>
  <rect class="w" x="18" y="11" width="2" height="2"/>
  <rect class="w" x="20" y="13" width="2" height="2"/>

  <!-- Flat right baseline -->
  <rect class="w"  x="22" y="15" width="2" height="2"/>
  <rect class="g2" x="24" y="15" width="2" height="2"/>
  <rect class="g3" x="26" y="15" width="2" height="2"/>
  <rect class="g4" x="28" y="15" width="2" height="2"/>

  <!-- Faultline crack going down from the peak -->
  <rect class="w"  x="14" y="5"  width="2" height="2"/>
  <rect class="g1" x="15" y="7"  width="2" height="2"/>
  <rect class="g1" x="14" y="9"  width="2" height="2"/>
  <rect class="g2" x="15" y="11" width="2" height="2"/>
  <rect class="g2" x="14" y="13" width="2" height="2"/>
  <rect class="g2" x="15" y="15" width="2" height="2"/>
  <rect class="g3" x="14" y="17" width="2" height="2"/>
  <rect class="g3" x="15" y="19" width="2" height="2"/>
  <rect class="g4" x="14" y="21" width="2" height="2"/>
  <rect class="g4" x="15" y="23" width="2" height="2"/>
  <rect class="g4" x="14" y="25" width="2" height="2"/>
  <rect class="g4" x="15" y="27" width="2" height="2"/>
</svg>
