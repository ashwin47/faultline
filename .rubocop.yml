plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "tmp/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Max: 40
  CountAsOne:
    - hash
    - heredoc
    - array

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Max: 200

Metrics/BlockLength:
  Exclude:
    - "config/routes.rb"

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 6

Layout/LineLength:
  Max: 120

Rails/SkipsModelValidations:
  Enabled: false
